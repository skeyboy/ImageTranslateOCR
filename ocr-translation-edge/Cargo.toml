[package]
name = "ocr-translation-edge"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22"
openai-oxide = { version = "0.15.0", default-features = false, features = ["chat"] }
ocr-translation-core = { path = "../ocr-translation-core" }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
